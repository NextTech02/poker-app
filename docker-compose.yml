services:

  # ── Backend API (FastAPI) ────────────────────────────────────────────────────
  backend:
    build: ./backend
    container_name: torneios-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_SERVICE_KEY=${SUPABASE_SERVICE_KEY}
      # Chave pública, usada como `apikey` quando o backend executa as queries
      # COMO O USUÁRIO (multi-tenant): nesse modo quem define a identidade é o
      # Authorization: Bearer <jwt>, e o RLS isola as organizações.
      # Reaproveita a mesma variável do frontend — é a mesma chave publishable.
      - SUPABASE_ANON_KEY=${REACT_APP_SUPABASE_ANON_KEY}
      - SUPABASE_JWT_SECRET=${SUPABASE_JWT_SECRET}
      - SUPER_ADMIN_USER_IDS=${SUPER_ADMIN_USER_IDS}
      - FRONTEND_URL=${FRONTEND_URL}
      # Interruptor de emergência do multi-tenant: false volta o backend ao modo
      # antigo (service_role, ignora RLS) sem precisar de deploy.
      - SUPABASE_RLS_AS_USER=${SUPABASE_RLS_AS_USER:-true}
      - ENVIRONMENT=production
    networks:
      - torneios-net

  # ── Frontend (React static) ──────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      args:
        REACT_APP_API_URL: ${REACT_APP_API_URL}
        REACT_APP_SUPABASE_URL: ${SUPABASE_URL}
        REACT_APP_SUPABASE_ANON_KEY: ${REACT_APP_SUPABASE_ANON_KEY}
    container_name: torneios-frontend
    restart: unless-stopped
    ports:
      - "3002:3000"
    networks:
      - torneios-net

  # ── Landing page (HTML estático) ─────────────────────────────────────────────
  # Mora na RAIZ do domínio (aceblind.net); o sistema fica em app.aceblind.net.
  # Container separado de propósito: a landing não tem build, não tem variável
  # de ambiente e muda por motivo de marketing — subir uma versão dela não pode
  # exigir rebuild do React nem derrubar quem está operando um torneio.
  landing:
    build: ./landing
    container_name: torneios-landing
    restart: unless-stopped
    ports:
      - "3003:80"
    networks:
      - torneios-net

  # ── Cloudflare Tunnel ─────────────────────────────────────────────────────────
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: torneios-tunnel
    restart: unless-stopped
    command: tunnel run
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      - backend
      - frontend
      - landing
    networks:
      - torneios-net

networks:
  torneios-net:
    driver: bridge
