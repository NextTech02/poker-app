server {
    listen 80;
    # IPv6 também. A imagem oficial acrescenta esta linha sozinha no default.conf
    # dela, mas para de fazer isso quando o arquivo é substituído — como aqui.
    # Sem ela, `http://localhost/` DENTRO do container resolve para ::1 e recebe
    # "Connection refused" com o nginx funcionando perfeitamente por IPv4. Foi o
    # que fez a verificação do deploy acusar erro numa landing que estava no ar.
    listen [::]:80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # A página é servida atrás do Cloudflare Tunnel, que já faz TLS e cache de
    # borda. Aqui basta entregar o arquivo certo, rápido e sem surpresa.

    # Redirecionamentos com caminho relativo (`Location: /es/`). O nginx só vê
    # http e a porta 80 do container; um redirect absoluto mandaria o visitante
    # para http://aceblind.net:80/es/.
    absolute_redirect off;

    # ATENÇÃO ao mexer aqui: `add_header` NÃO acumula entre níveis — veja
    # seguranca.conf. Todo bloco que define um add_header próprio repete o
    # include.
    include /etc/nginx/aceblind-seguranca.conf;

    # Endereço que não existe recebe 404 DE VERDADE, com uma página que leva
    # de volta à home, ao teste grátis e ao sistema. Antes, qualquer caminho
    # devolvia a home com status 200: para o Google, cada link quebrado era
    # mais uma cópia da página inicial.
    error_page 404 /404.html;
    location = /404.html {
        internal;
        add_header Cache-Control "no-cache" always;
        include /etc/nginx/aceblind-seguranca.conf;
    }

    # ── As três páginas: / (português), /es/ e /en/ ─────────────────────────
    # O HTML NÃO fica em cache: é onde moram preço, plano e texto. Um clube
    # abrindo a página com a tabela do mês passado é pior que uma requisição a
    # mais.
    location = / {
        # `?lang=es` era como o link pronto do marketing abria a página em
        # outro idioma, quando os três viviam na mesma URL. Esses links já
        # circularam por WhatsApp: continuam funcionando, agora levando para a
        # página daquele idioma — e o Google consolida tudo nela.
        if ($arg_lang ~* "^es") { return 301 /es/; }
        if ($arg_lang ~* "^en") { return 301 /en/; }

        add_header Cache-Control "no-cache" always;
        include /etc/nginx/aceblind-seguranca.conf;
        try_files /index.html =404;
    }

    location ~ ^/(es|en)/$ {
        add_header Cache-Control "no-cache" always;
        include /etc/nginx/aceblind-seguranca.conf;
        try_files ${uri}index.html =404;
    }

    # Uma URL só por página. `/es` e `/es/index.html` são a mesma página que
    # `/es/`; sem o 301 o buscador as trata como cópias e divide o peso.
    location ~ ^/(es|en)$ {
        return 301 /$1/;
    }
    location ~ ^/((es|en)/)?index\.html$ {
        return 301 /$1;
    }

    # Imagens e fontes podem ficar. Trocar o conteúdo delas exige trocar o
    # nome do arquivo (og.png -> og-v2.png), que é o combinado.
    location ~* \.(png|jpg|jpeg|svg|webp|ico|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, immutable" always;
        include /etc/nginx/aceblind-seguranca.conf;
    }

    # robots.txt, sitemap.xml e o que mais estiver na pasta. O que não existir
    # cai no 404 acima.
    location / {
        try_files $uri =404;
    }

    gzip on;
    # `text/html` NÃO entra na lista: o nginx sempre comprime html, e repetir
    # aqui faz ele subir avisando "duplicate MIME type" a cada start.
    gzip_types text/css application/javascript image/svg+xml application/xml text/xml text/plain;
    gzip_min_length 1024;
}
