server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # A página é servida atrás do Cloudflare Tunnel, que já faz TLS e cache de
    # borda. Aqui basta entregar o arquivo certo, rápido e sem surpresa.

    # O HTML NÃO fica em cache: é onde moram preço, plano e texto. Um clube
    # abrindo a página com a tabela do mês passado é pior que uma requisição a
    # mais — e o arquivo tem ~45 KB.
    location = / {
        add_header Cache-Control "no-cache";
        try_files /index.html =404;
    }

    # Imagens e fontes podem ficar. Trocar o conteúdo delas exige trocar o
    # nome do arquivo (og.png -> og-v2.png), que é o combinado.
    location ~* \.(png|jpg|jpeg|svg|webp|ico|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    gzip on;
    gzip_types text/html text/css application/javascript image/svg+xml;
    gzip_min_length 1024;

    # Cabeçalhos de segurança. Não há login nem dado de sessão aqui, mas a
    # página tem um formulário: sem eles, um iframe alheio poderia embutir a
    # landing e colher o que a pessoa digita.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Qualquer caminho que não exista cai na página. É uma página só: quem
    # chegar por um link antigo vê a landing em vez de um 404 do nginx.
    location / {
        try_files $uri /index.html;
    }
}
