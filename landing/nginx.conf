server {
    listen 80;
    # IPv6 também. A imagem oficial acrescenta esta linha sozinha no default.conf
    # dela, mas para de fazer isso quando o arquivo é substituído — como aqui.
    # Sem ela, `http://localhost/` DENTRO do container resolve para ::1 e recebe
    # "Connection refused" com o nginx funcionando perfeitamente por IPv4. Foi o
    # que fez a verificação do deploy acusar erro numa landing que estava no ar.
    listen [::]:80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # A página é servida atrás do Cloudflare Tunnel, que já faz TLS e cache de
    # borda. Aqui basta entregar o arquivo certo, rápido e sem surpresa.

    # ATENÇÃO ao mexer aqui: `add_header` NÃO acumula entre níveis. Um único
    # `add_header` dentro de um `location` descarta TODOS os herdados do
    # `server` — e foi o que aconteceu: a home saía sem nenhum dos três
    # cabeçalhos de segurança, justamente a página que tem o formulário,
    # enquanto o robots.txt (sem add_header próprio) os recebia normalmente.
    # Por isso os quatro estão repetidos em cada bloco que define algum.

    # O HTML NÃO fica em cache: é onde moram preço, plano e texto. Um clube
    # abrindo a página com a tabela do mês passado é pior que uma requisição a
    # mais — e o arquivo tem ~45 KB.
    location = / {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        try_files /index.html =404;
    }

    # Imagens e fontes podem ficar. Trocar o conteúdo delas exige trocar o
    # nome do arquivo (og.png -> og-v2.png), que é o combinado.
    location ~* \.(png|jpg|jpeg|svg|webp|ico|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    gzip on;
    # `text/html` NÃO entra na lista: o nginx sempre comprime html, e repetir
    # aqui faz ele subir avisando "duplicate MIME type" a cada start.
    gzip_types text/css application/javascript image/svg+xml application/xml;
    gzip_min_length 1024;

    # Cabeçalhos de segurança. Não há login nem dado de sessão aqui, mas a
    # página tem um formulário: sem eles, um iframe alheio poderia embutir a
    # landing e colher o que a pessoa digita.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Qualquer caminho que não exista cai na página. É uma página só: quem
    # chegar por um link antigo vê a landing em vez de um 404 do nginx.
    location / {
        try_files $uri /index.html;
    }
}
