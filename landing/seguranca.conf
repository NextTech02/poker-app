# Cabeçalhos de segurança, incluídos em CADA bloco que define add_header.
#
# `add_header` NÃO acumula entre níveis: um único add_header dentro de um
# `location` descarta todos os herdados do `server`. Já aconteceu aqui — a
# home saía sem nenhum destes, justamente a página que tem o formulário. Por
# isso eles moram neste arquivo e cada location faz `include`.
#
# Não há login nem dado de sessão na landing, mas há um formulário: sem
# X-Frame-Options, um iframe alheio poderia embutir a página e colher o que a
# pessoa digita.
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
