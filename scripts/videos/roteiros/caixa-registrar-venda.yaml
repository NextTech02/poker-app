id: caixa-registrar-venda
area: caixa
tipo: curto
sessao: true
modulo: tournament
inicio: /caixa
titulo:
  pt-BR: "Como registrar uma venda no Caixa"
  en-US: "How to record a sale at the cash register"
  es-ES: "Cómo registrar una venta en la caja"
descricao:
  pt-BR: "Do jogador ao bilhete com mesa e assento."
  en-US: "From the player to the ticket with table and seat."
  es-ES: "Del jugador al boleto con mesa y asiento."
passos:
  - fala:
      pt-BR: "Na tela de Vendas, você registra a entrada de um jogador no torneio. Antes de vender, confira se o seu caixa está aberto."
      en-US: "On the Sales screen, you record a player's entry into a tournament. Before selling, make sure your cash register is open."
      es-ES: "En la pantalla de Ventas, registras la entrada de un jugador al torneo. Antes de vender, confirma que tu caja esté abierta."
    acoes:
      - destacar: {css: ".cashbox-banner"}
        segundos: 2.5
  - fala:
      pt-BR: "Clique em Nova Transação."
      en-US: "Click New Transaction."
      es-ES: "Haz clic en Nueva Transacción."
    acoes:
      - clicar: {papel: button, t: cashRegister.newTransaction}
  - fala:
      pt-BR: "Escolha o torneio. Quando ele tem um dia só, o dia entra sozinho, e você confere aqui a lotação e o valor."
      en-US: "Choose the tournament. When it has a single day, the day is filled in for you, and you can check capacity and price here."
      es-ES: "Elige el torneo. Cuando tiene un solo día, el día se completa solo, y aquí revisas el cupo y el valor."
    acoes:
      - escolher: {css: "#tournament_id", rotulo_opcao: "Main Event"}
      - destacar: {css: ".cx-day-auto"}
  - fala:
      pt-BR: "Digite o nome do jogador e selecione na lista."
      en-US: "Type the player's name and select it from the list."
      es-ES: "Escribe el nombre del jugador y selecciónalo en la lista."
    acoes:
      - digitar: {css: ".player-select-input", valor: "{jogador}"}
      - clicar: {css: "li.player-select-option"}
  - fala:
      pt-BR: "Marque o que ele está comprando. O valor e as fichas a entregar são calculados automaticamente."
      en-US: "Check what the player is buying. The amount and the chips to deliver are calculated automatically."
      es-ES: "Marca lo que está comprando. El valor y las fichas a entregar se calculan automáticamente."
    acoes:
      - clicar: {css: ".cx-buytype-option", texto: "Buy-in"}
      - destacar: {css: ".cx-sale-totals"}
  - fala:
      pt-BR: "Escolha a forma de pagamento e clique em Registrar."
      en-US: "Choose the payment method and click Register."
      es-ES: "Elige el método de pago y haz clic en Registrar."
    acoes:
      - escolher: {css: "#payment_method", opcao: "pix"}
      - clicar: {css: "form button[type=submit]"}
  - fala:
      pt-BR: "Pronto. O sistema senta o jogador e mostra o bilhete com a mesa, o assento e as fichas. É só imprimir e entregar."
      en-US: "Done. The system seats the player and shows the ticket with the table, the seat and the chips. Just print it and hand it over."
      es-ES: "Listo. El sistema sienta al jugador y muestra el boleto con la mesa, el asiento y las fichas. Solo tienes que imprimirlo y entregarlo."
    acoes:
      - pausa: 1.0
