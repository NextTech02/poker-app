# ============================================================================
# SonarQube / SonarCloud — análise estática do AceBlind
# ============================================================================
# Vale para qualquer hospedagem: o servidor e o token entram por variável de
# ambiente ou parâmetro do scanner, nunca aqui (este arquivo vai para o Git).
#
#   SonarCloud   : sonar-scanner -Dsonar.token=$TOKEN
#   auto-hospedado: sonar-scanner -Dsonar.host.url=http://... -Dsonar.token=$TOKEN
# ============================================================================

sonar.projectKey=aceblind
sonar.projectName=AceBlind
sonar.sourceEncoding=UTF-8

# ── O que analisar ───────────────────────────────────────────────────────────
# Só o código que escrevemos. O `db/` fica de fora de propósito: a análise de
# SQL é recurso das edições pagas; na Community as migrações seriam apenas
# ignoradas, e listá-las aqui daria a falsa impressão de estarem cobertas.
sonar.sources=frontend/src,backend/app
sonar.tests=backend/tests

# ── O que ignorar ────────────────────────────────────────────────────────────
# node_modules e venv sozinhos multiplicariam o volume analisado por dezenas de
# vezes — e nada ali é nosso.
sonar.exclusions=\
  **/node_modules/**,\
  **/build/**,\
  **/dist/**,\
  **/__pycache__/**,\
  **/venv/**,\
  **/.venv/**,\
  **/*.min.js,\
  frontend/public/**,\
  frontend/src/locales/*.json,\
  docs/**,\
  frontend/src/assets/**,\
  **/*.png,**/*.jpg,**/*.jpeg,**/*.gif,**/*.svg,**/*.ico,**/*.webp

# Testes não entram na contagem de duplicação: repetir arranjo entre casos de
# teste é normal e viraria ruído.
sonar.cpd.exclusions=backend/tests/**,**/*.test.js

# ── Linguagens ───────────────────────────────────────────────────────────────
sonar.python.version=3.12

# Cobertura: os caminhos ficam prontos, mas só valem quando os testes rodarem
# com relatório. Sem o arquivo, o Sonar apenas reporta 0% — não quebra.
#   backend : pytest --cov=app --cov-report=xml
#   frontend: npm test -- --coverage --watchAll=false
sonar.python.coverage.reportPaths=backend/coverage.xml
sonar.javascript.lcov.reportPaths=frontend/coverage/lcov.info
